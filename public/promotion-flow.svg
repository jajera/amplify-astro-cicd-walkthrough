  <text x="762" y="390" text-anchor="middle" fill="#04222a" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">main · main.app.amplifyapp.com</text>
  <text x="48" y="250" fill="#b7cdd4" font-family="Segoe UI, sans-serif" font-size="15">GitHub Actions = merge gate</text>
  <text x="48" y="278" fill="#b7cdd4" font-family="Segoe UI, sans-serif" font-size="15">Amplify = build and host on push</text>
  <text x="48" y="306" fill="#5a7a86" font-family="Segoe UI, sans-serif" font-size="14">No custom domain in this lab</text>
